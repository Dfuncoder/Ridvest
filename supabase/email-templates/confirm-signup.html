<!--
  SUPABASE → Authentication → Email Templates → CONFIRM SIGNUP
  Subject: Confirm your Rydvest account

  The code a new user types on /verify-otp to confirm their email address.

  ⚠ {{ .Token }} IS THE CODE, NOT A URL. It must be printed as text — putting
    it in an href builds a link pointing at the digits themselves.

  {{ .ConfirmationURL }} is left out on purpose: the app's flow is a code typed
  into /verify-otp, and offering a link as well just gives people two routes
  where one of them lands somewhere they are not expecting.
-->
<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f1f5f9;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden" cellpadding="0" cellspacing="0">

            <tr>
              <td style="background:#0d2137;padding:26px 28px">
                <p style="margin:0;color:#facc15;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">Rydvest</p>
              </td>
            </tr>

            <tr>
              <td style="padding:32px 28px 8px" align="center">
                <p style="margin:0 0 6px;color:#0f172a;font-size:20px;font-weight:800">Welcome to Rydvest</p>
                <p style="margin:0 0 22px;color:#64748b;font-size:14px;line-height:1.6">
                  Enter this code to confirm your email and finish setting up your account.
                </p>

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto">
                  <tr>
                    <td style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px 28px">
                      <span style="color:#0f172a;font-size:34px;font-weight:800;letter-spacing:.22em;font-family:'SF Mono',Menlo,Consolas,monospace">{{ .Token }}</span>
                    </td>
                  </tr>
                </table>

                <p style="margin:18px 0 0;color:#94a3b8;font-size:13px">
                  It expires in 60 minutes.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:24px 28px 28px;border-top:1px solid #f1f5f9">
                <p style="margin:18px 0 0;color:#94a3b8;font-size:12px;line-height:1.6">
                  If you did not create a Rydvest account, you can ignore this email — nothing will
                  happen without this code.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
